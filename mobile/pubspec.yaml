name: mobile

description: "IbuSehat"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Markdown dependencies
  flutter_markdown: ^0.7.0

  # Secure storage dependencies
  flutter_secure_storage: ^9.2.2

  # HTTP dependencies
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.12.0
  flutter_svg: ^2.2.4
  intl: ^0.20.2

  video_player: ^2.11.1
  share_plus: ^12.0.2
  screenshot: ^3.0.0
  image_gallery_saver_plus: ^4.0.1
  device_info_plus: ^10.1.0
  path_provider: ^2.1.5
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  google_maps_flutter: ^2.10.0
  provider: ^6.1.2
  dio: ^5.8.0+1
  fl_chart: ^0.70.2

  # Webview dependencies
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0
  confetti: ^0.7.0
  firebase_messaging: ^16.2.0
  app_settings: ^5.1.1

  # Workout & tracking dependencies
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # Firebase dependencies
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  cached_network_image: ^3.4.1

  # Loading screens
  path_drawing: ^1.0.1
  skeletonizer: ^2.1.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Launcher & splash screen dependencies
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0
  

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:

    # logo
    - assets/logo/ibusehat_logo.webp
    - assets/logo/ibusehat_logo_transparent.webp

    # icons
    - assets/images/body_silhouette.png
    - assets/images/woman_height.png
    - assets/images/ibu_character.png
    - assets/images/programs/
    - assets/images/workouts/
    - assets/icons/google.webp
    - assets/icons/glass.svg
    - assets/icons/medium_bottle.svg
    - assets/icons/gallon_water.svg
    - assets/icons/custom_glass_bottle.svg
    - assets/icons/water_glass.svg
    - assets/icons/message_circle.svg
    - assets/icons/sparkles_premium.svg

    # videos
    - assets/videos/
    - assets/videos/exercises/

    # skincare
    - assets/images/skincare/bekas_luka_sesar.webp
    - assets/images/skincare/bekas_operasi.webp
    - assets/images/skincare/jerawat_hormonal.webp
    - assets/images/skincare/kulit_kering.webp
    - assets/images/skincare/stretch_marks.webp
    - assets/images/skincare/hiperpigmentasi.webp
    - assets/images/skincare/stretch_marks_sesar.webp
    - assets/images/skincare/hero_section_normal.webp
    - assets/images/skincare/hero_section_sesar.webp
